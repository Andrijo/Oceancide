name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Formato
        run: bun run format:check

      - name: Tests
        run: bun run test:run

      - name: Build
        run: bun run build

      # Informa del tamaño del bundle y falla si crece por encima del umbral.
      - name: Tamaño del bundle
        run: |
          LIMIT_KB=1100
          SIZE_KB=$(du -sk dist | cut -f1)
          JS_KB=$(find dist -name '*.js' -print0 | du -ck --files0-from=- | tail -1 | cut -f1)
          {
            echo "### Tamaño del bundle"
            echo ""
            echo "| | kB |"
            echo "| --- | --- |"
            echo "| dist/ total | ${SIZE_KB} |"
            echo "| JS | ${JS_KB} |"
            echo "| Límite (JS) | ${LIMIT_KB} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JS_KB" -gt "$LIMIT_KB" ]; then
            echo "::error::El JS del bundle (${JS_KB} kB) supera el límite de ${LIMIT_KB} kB"
            exit 1
          fi
