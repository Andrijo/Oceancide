<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Oceancide</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        font-family: "Montserrat", Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      #ui-overlay {
        position: absolute;
        bottom: 10px;
        left: 50px;
        display: flex;
        flex-direction: column;
        font-family: "Montserrat", sans-serif;
        color: #f7f7ff;
        line-height: 1.2;
        pointer-events: none;
        z-index: 100;
      }

      .stat-box {
        background: none;
        padding: 10px 20px;
        border-radius: 10px;
        opacity: 1;
      }

      .stat-label {
        font-size: 14px;
        letter-spacing: 1px;
        opacity: 1;
        z-index: 100;
      }

      .stat-value {
        font-size: 24px;
        font-weight: bold;
        margin-top: 5px;
        opacity: 1;
      }

      #controls-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-family: "Montserrat", sans-serif;
        text-align: center;
        pointer-events: none;
      }

      #toxicity-bar {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 200px;
        height: 20px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        opacity: 0;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      #toxicity-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ff88, #ff6600, #ff0000);
        transition: width 0.3s ease;
      }

      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #controls-hint.hidden {
        display: none;
      }

      /* Controles para móviles */
      :root {
        --touch-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
      }

      #touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 200;
      }

      #touch-controls.visible {
        display: block;
      }

      /* Mitad izquierda, zona del joystick */
      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #joystick-base {
        position: absolute;
        left: calc(30px + env(safe-area-inset-left, 0px));
        bottom: var(--touch-bottom);
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #joystick-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(180, 240, 255, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Mitad derecha, controla el nivel de profundidad */
      #depth-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #depth-base {
        position: absolute;
        right: calc(30px + env(safe-area-inset-right, 0px));
        bottom: var(--touch-bottom);
        width: 70px;
        height: 160px;
        border-radius: 35px;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #depth-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #depth-base::before,
      #depth-base::after {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        line-height: 1;
      }

      #depth-base::before {
        content: "▲";
        top: 8px;
      }

      #depth-base::after {
        content: "▼";
        bottom: 8px;
      }

      #depth-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #f7f7ff;
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Botón de boost de velocidad */
      #boost-btn {
        position: absolute;
        right: calc(36px + env(safe-area-inset-right, 0px));
        bottom: calc(var(--touch-bottom) + 180px);
      }

      .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 26px;
        color: white;
        background: none;
        border: 2px solid #f7f7ff;
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-btn.active {
        background: #ffffff;
      }

      @media (max-width: 700px) {
        #ui-overlay {
          top: 10px;
          left: 10px;
          opacity: 0;
        }
        .stat-box {
          padding: 6px 10px;
          margin-bottom: 5px;
          opacity: 0;
        }
        .stat-value {
          font-size: 16px;
          margin-top: 2px;
          opacity: 0;
        }
        #toxicity-bar {
          top: 10px;
          right: 10px;
          width: 120px;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-overlay">
        <div class="stat-box">
          <div class="stat-label">Desechos Recolectados</div>
          <div class="stat-value" id="debris-count">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Conciencia Ecológica</div>
          <div class="stat-value" id="eco-awareness">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Progreso de Zona</div>
          <div class="stat-value" id="zone-progress">0%</div>
        </div>
      </div>

      <div id="toxicity-bar">
        <div id="toxicity-fill"></div>
      </div>

      <div id="controls-hint">
        WASD / Flechas: Moverse | U / J: Subir / Bajar | I: Impulso | Q/E: Girar
        | C: Vista trasera | R: Reiniciar
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
