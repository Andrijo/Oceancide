<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Oceancide</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        font-family: "Montserrat", Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      #ui-overlay {
        position: absolute;
        bottom: 10px;
        left: 50px;
        display: flex;
        flex-direction: column;
        font-family: "Montserrat", sans-serif;
        color: #f7f7ff;
        line-height: 1.2;
        pointer-events: none;
        z-index: 100;
      }

      .stat-box {
        background: none;
        padding: 10px 20px;
        border-radius: 10px;
        opacity: 1;
      }

      .stat-label {
        font-size: 14px;
        letter-spacing: 1px;
        opacity: 1;
        z-index: 100;
      }

      .stat-value {
        font-size: 24px;
        font-weight: bold;
        margin-top: 5px;
        opacity: 1;
      }

      #controls-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-family: "Montserrat", sans-serif;
        text-align: center;
        pointer-events: none;
      }

      /* ============================================
         Calavera de toxicidad
         ============================================ */

      .toxicity-skull {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 76px;
        height: 92px;
        z-index: 150;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        will-change: transform, opacity;
      }

      .toxicity-skull.active {
        opacity: 1;
      }

      .toxicity-skull svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .skull-shape {
        fill: rgba(28, 16, 16, 0.85);
        stroke: rgba(220, 230, 240, 0.55);
        stroke-width: 2;
        stroke-linejoin: round;
        transition:
          stroke 0.3s ease,
          filter 0.3s ease;
      }

      .skull-hole {
        fill: rgba(10, 6, 6, 0.95);
      }

      .skull-tooth {
        fill: rgba(10, 6, 6, 0.95);
      }

      .skull-fill {
        fill: #2ecc71;
        /* Vacío: desplazado 120px hacia abajo (altura del viewBox) */
        transform: translateY(120px);
        transition: fill 0.3s ease;
      }

      .toxicity-skull.level-low .skull-fill {
        fill: #2ecc71;
      }
      .toxicity-skull.level-mid .skull-fill {
        fill: #facc15;
      }
      .toxicity-skull.level-high .skull-fill {
        fill: #f97316;
      }
      .toxicity-skull.level-crit .skull-fill {
        fill: #ef4444;
      }

      .toxicity-skull.level-crit .skull-shape {
        stroke: rgba(255, 80, 80, 0.95);
        filter: drop-shadow(0 0 8px rgba(255, 60, 60, 0.7));
      }

      .toxicity-skull.level-low {
        animation: skullPulse 3s ease-in-out infinite;
      }
      .toxicity-skull.level-mid {
        animation: skullPulse 2s ease-in-out infinite;
      }
      .toxicity-skull.level-high {
        animation: skullPulse 1.2s ease-in-out infinite;
      }
      .toxicity-skull.level-crit {
        animation: skullPulse 0.6s ease-in-out infinite;
      }

      /* Flash verde cuando la toxicidad baja */
      .toxicity-skull.cleansing .skull-shape {
        stroke: rgba(120, 255, 160, 0.95);
        filter: drop-shadow(0 0 10px rgba(80, 255, 140, 0.8));
      }

      .toxicity-skull.cleansing .skull-fill {
        filter: brightness(1.4) saturate(1.3);
      }

      @keyframes skullPulse {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
        }
        50% {
          transform: translateX(-50%) scale(1.08);
        }
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes floatUpFade {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.6);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.15);
        }
        40% {
          transform: translate(-50%, -50%) scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, calc(-50% - 70px)) scale(1);
        }
      }

      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #controls-hint.hidden {
        display: none;
      }

      /* Controles para móviles */
      :root {
        --touch-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
      }

      #touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 200;
      }

      #touch-controls.visible {
        display: block;
      }

      /* Mitad izquierda, zona del joystick */
      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #joystick-base {
        position: absolute;
        left: calc(30px + env(safe-area-inset-left, 0px));
        bottom: var(--touch-bottom);
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #joystick-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(180, 240, 255, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Mitad derecha, controla el nivel de profundidad */
      #depth-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #depth-base {
        position: absolute;
        right: calc(30px + env(safe-area-inset-right, 0px));
        bottom: var(--touch-bottom);
        width: 70px;
        height: 160px;
        border-radius: 35px;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #depth-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #depth-base::before,
      #depth-base::after {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        line-height: 1;
      }

      #depth-base::before {
        content: "▲";
        top: 8px;
      }

      #depth-base::after {
        content: "▼";
        bottom: 8px;
      }

      #depth-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #f7f7ff;
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Botón de boost de velocidad */
      #boost-btn {
        position: absolute;
        right: calc(36px + env(safe-area-inset-right, 0px));
        bottom: calc(var(--touch-bottom) + 180px);
      }

      .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 26px;
        color: white;
        background: none;
        border: 2px solid #f7f7ff;
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-btn.active {
        background: #ffffff;
      }

      @media (max-width: 700px) {
        #ui-overlay {
          top: 10px;
          left: 10px;
          /* El HUD ahora SÍ se ve en móvil */
        }

        .stat-box {
          padding: 6px 10px;
          margin-bottom: 5px;
        }

        .stat-value {
          font-size: 16px;
          margin-top: 2px;
        }

        .toxicity-skull {
          top: 60px;
          width: 56px;
          height: 68px;
        }

        /* En móvil el hint de teclado no aplica: se oculta */
        #controls-hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-overlay">
        <div class="stat-box">
          <div class="stat-label">Desechos Recolectados</div>
          <div class="stat-value" id="debris-count">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Conciencia Ecológica</div>
          <div class="stat-value" id="eco-awareness">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Progreso de Zona</div>
          <div class="stat-value" id="zone-progress">0%</div>
        </div>
      </div>

      <div id="toxicity-skull" class="toxicity-skull" aria-hidden="true">
        <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet">
          <!-- Silueta de calavera -->
          <path
            class="skull-shape"
            d="M50 6
               C 24 6, 10 24, 10 46
               C 10 62, 16 72, 22 78
               L 22 92
               C 22 98, 26 102, 32 102
               L 38 102
               L 38 110
               C 38 115, 42 118, 46 118
               L 54 118
               C 58 118, 62 115, 62 110
               L 62 102
               L 68 102
               C 74 102, 78 98, 78 92
               L 78 78
               C 84 72, 90 62, 90 46
               C 90 24, 76 6, 50 6 Z" />
          <!-- Cuencas y nariz -->
          <ellipse class="skull-hole" cx="35" cy="48" rx="9" ry="11" />
          <ellipse class="skull-hole" cx="65" cy="48" rx="9" ry="11" />
          <path class="skull-hole" d="M50 62 L 45 74 L 55 74 Z" />
          <!-- Dientes -->
          <rect class="skull-tooth" x="40" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="46" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="52" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="58" y="88" width="3" height="10" />

          <!-- Relleno animado: sube desde abajo con translateY -->
          <g mask="url(#skull-mask)">
            <rect
              id="toxicity-skull-fill"
              x="0"
              y="0"
              width="100"
              height="120"
              class="skull-fill" />
          </g>

          <!-- Máscara: silueta blanca deja ver, agujeros negros ocultan -->
          <defs>
            <mask
              id="skull-mask"
              maskUnits="userSpaceOnUse"
              maskContentUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="100"
              height="120">
              <path
                fill="white"
                d="M50 6
                   C 24 6, 10 24, 10 46
                   C 10 62, 16 72, 22 78
                   L 22 92
                   C 22 98, 26 102, 32 102
                   L 38 102
                   L 38 110
                   C 38 115, 42 118, 46 118
                   L 54 118
                   C 58 118, 62 115, 62 110
                   L 62 102
                   L 68 102
                   C 74 102, 78 98, 78 92
                   L 78 78
                   C 84 72, 90 62, 90 46
                   C 90 24, 76 6, 50 6 Z" />
              <ellipse fill="black" cx="35" cy="48" rx="9" ry="11" />
              <ellipse fill="black" cx="65" cy="48" rx="9" ry="11" />
              <path fill="black" d="M50 62 L 45 74 L 55 74 Z" />
              <rect fill="black" x="40" y="88" width="3" height="10" />
              <rect fill="black" x="46" y="88" width="3" height="10" />
              <rect fill="black" x="52" y="88" width="3" height="10" />
              <rect fill="black" x="58" y="88" width="3" height="10" />
            </mask>
          </defs>
        </svg>
      </div>

      <div id="controls-hint">
        WASD mover · U/J profundidad · I impulso · Q/E giro · B filtro · C mirar
        atrás · R reiniciar · Enter pausa
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
