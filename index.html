<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Oceancide: sumérgete en el océano, recoge desechos y devuelve la vida al ecosistema." />
    <meta name="theme-color" content="#020a12" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oceancide" />
    <meta
      property="og:description"
      content="Sumérgete en el océano, recoge desechos y devuelve la vida al ecosistema." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Oceancide" />
    <meta
      name="twitter:description"
      content="Sumérgete en el océano, recoge desechos y devuelve la vida al ecosistema." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/dm-sans-regular.woff"
      as="font"
      type="font/woff"
      crossorigin />
    <link
      rel="preload"
      href="/fonts/pogonia-bold.woff"
      as="font"
      type="font/woff"
      crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Oceancide</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background-color: #020a12;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body {
        overflow: hidden;
        font-family: "DMSans", Tahoma, Geneva, Verdana, sans-serif;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      #ui-overlay {
        position: absolute;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        left: calc(50px + env(safe-area-inset-left, 0px));
        display: flex;
        flex-direction: column;
        font-family: "DMSans", Tahoma, Geneva, Verdana, sans-serif;
        color: #f7f7ff;
        line-height: 1.2;
        pointer-events: none;
        z-index: 100;
      }

      .stat-box {
        background: none;
        padding: 10px 20px;
        border-radius: 10px;
        opacity: 1;
      }

      .stat-label {
        font-size: 17px;
        opacity: 1;
        z-index: 100;
      }

      .stat-value {
        font-size: 26px;
        font-weight: bold;
        margin-top: 5px;
        opacity: 1;
      }

      #controls-hint {
        position: absolute;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 17px;
        font-family: "DMSans", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        pointer-events: none;
      }

      /* Cluster de peligro (arriba centro): toxicidad + temporizador, sin competir con recursos ni pausa. */
      #danger-cluster {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        z-index: 150;
        pointer-events: none;
      }

      .toxicity-skull {
        position: relative;
        width: 76px;
        height: 92px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        will-change: transform, opacity;
      }

      .toxicity-skull.active {
        opacity: 1;
      }

      .toxicity-skull svg {
        width: 100%;
        height: 100%;
        display: block;
        /* El glow se dibuja fuera del viewBox; sin esto se recorta. */
        overflow: visible;
      }

      .skull-shape {
        fill: rgba(28, 16, 16, 0.85);
        stroke: rgba(220, 230, 240, 0.55);
        stroke-width: 2;
        stroke-linejoin: round;
        transition:
          stroke 0.3s ease,
          filter 0.3s ease;
      }

      .skull-hole {
        fill: rgba(10, 6, 6, 0.95);
      }

      .skull-tooth {
        fill: rgba(10, 6, 6, 0.95);
      }

      /* El relleno es lodo tóxico: verde pantano → oliva → óxido → sangre (el verde brillante queda para limpiar). */
      .skull-fill {
        fill: #22331f;
        /* Vacío: desplazado 120px hacia abajo (altura del viewBox) */
        transform: translateY(120px);
        transition: fill 0.3s ease;
      }

      .toxicity-skull.level-low .skull-fill {
        fill: #2e4a29;
      }
      .toxicity-skull.level-mid .skull-fill {
        fill: #5c6b22;
      }
      .toxicity-skull.level-high .skull-fill {
        fill: #8a5a17;
      }
      .toxicity-skull.level-crit .skull-fill {
        fill: #8e1b1b;
      }

      .toxicity-skull.level-crit .skull-shape {
        stroke: rgba(255, 110, 110, 1);
        filter: url(#skull-glow-red);
      }

      /* Chevron de tendencia: ▲ subiendo (empeora), ▼ bajando (limpiando) */
      .toxicity-trend {
        position: absolute;
        right: -12px;
        bottom: 4px;
        font-size: 15px;
        font-weight: bold;
        line-height: 1;
        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease,
          color 0.2s ease;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
      }
      .toxicity-trend.up {
        opacity: 1;
        transform: scale(1);
        color: #ff6b6b;
      }
      .toxicity-trend.down {
        opacity: 1;
        transform: scale(1);
        color: #4ade80;
      }

      .toxicity-skull.level-low {
        animation: skullPulse 3s ease-in-out infinite;
      }
      .toxicity-skull.level-mid {
        animation: skullPulse 2s ease-in-out infinite;
      }
      .toxicity-skull.level-high {
        animation: skullPulse 1.2s ease-in-out infinite;
      }
      .toxicity-skull.level-crit {
        animation: skullPulse 0.6s ease-in-out infinite;
      }

      /* Flash verde cuando la toxicidad baja */
      .toxicity-skull.cleansing .skull-shape {
        stroke: rgba(150, 255, 185, 1);
        filter: url(#skull-glow-green);
      }

      .toxicity-skull.cleansing .skull-fill {
        filter: brightness(1.4) saturate(1.3);
      }

      @keyframes skullPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes floatUpFade {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.6);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.15);
        }
        40% {
          transform: translate(-50%, -50%) scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, calc(-50% - 70px)) scale(1);
        }
      }

      body {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #controls-hint.hidden {
        display: none;
      }

      /* Controles para móviles */
      :root {
        --touch-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
      }

      #touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 200;
      }

      #touch-controls.visible {
        display: block;
      }

      /* Mitad izquierda, zona del joystick */
      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #joystick-base {
        position: absolute;
        left: calc(30px + env(safe-area-inset-left, 0px));
        bottom: var(--touch-bottom);
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #joystick-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(180, 240, 255, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Mitad derecha, controla el nivel de profundidad */
      #depth-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #depth-base {
        position: absolute;
        right: calc(30px + env(safe-area-inset-right, 0px));
        bottom: var(--touch-bottom);
        width: 70px;
        height: 160px;
        border-radius: 35px;
        background: none;
        border: 2px solid #f7f7ff;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      #depth-base.active {
        opacity: 1;
        background: none;
        border-color: #ffffff;
      }

      #depth-base::before,
      #depth-base::after {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 15px;
        line-height: 1;
      }

      #depth-base::before {
        content: "▲";
        top: 8px;
      }

      #depth-base::after {
        content: "▼";
        bottom: 8px;
      }

      #depth-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #f7f7ff;
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Botón de boost de velocidad */
      #boost-btn {
        position: absolute;
        right: calc(36px + env(safe-area-inset-right, 0px));
        bottom: calc(var(--touch-bottom) + 180px);
      }

      .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 28px;
        color: white;
        background: none;
        border: 2px solid #f7f7ff;
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-btn.active {
        background: #ffffff;
      }

      @media (max-width: 700px) {
        #ui-overlay {
          top: calc(10px + env(safe-area-inset-top, 0px));
          left: calc(10px + env(safe-area-inset-left, 0px));
          bottom: auto;
          /* El HUD ahora SÍ se ve en móvil */
        }

        .stat-box {
          padding: 6px 10px;
          margin-bottom: 5px;
        }

        .stat-label {
          font-size: 13px;
        }

        .stat-value {
          font-size: 18px;
          margin-top: 2px;
        }

        .toxicity-skull {
          width: 56px;
          height: 68px;
        }

        /* En móvil el hint de teclado no aplica: se oculta */
        #controls-hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-overlay" role="group" aria-label="Estadísticas de la partida">
        <div class="stat-box">
          <div class="stat-label" id="debris-label">Desechos recolectados</div>
          <div
            class="stat-value"
            id="debris-count"
            role="status"
            aria-labelledby="debris-label">
            0
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="eco-label">Conciencia ecológica</div>
          <div
            class="stat-value"
            id="eco-awareness"
            role="status"
            aria-labelledby="eco-label">
            0
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="zone-label">Progreso de zona</div>
          <div
            class="stat-value"
            id="zone-progress"
            role="status"
            aria-labelledby="zone-label">
            0%
          </div>
        </div>
      </div>

      <div id="toxicity-skull" class="toxicity-skull" aria-hidden="true">
        <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Glow SVG nativo: sigue la silueta del path y no la caja del filtro. -->
            <filter
              id="skull-glow-red"
              x="-60%"
              y="-60%"
              width="220%"
              height="220%">
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="1.5"
                flood-color="#ff8a80"
                flood-opacity="0.95" />
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="5"
                flood-color="#ff2d2d"
                flood-opacity="0.9" />
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="11"
                flood-color="#ff0000"
                flood-opacity="0.65" />
            </filter>
            <filter
              id="skull-glow-green"
              x="-60%"
              y="-60%"
              width="220%"
              height="220%">
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="1.5"
                flood-color="#d6ffe2"
                flood-opacity="0.95" />
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="5"
                flood-color="#50ff8c"
                flood-opacity="0.95" />
              <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="11"
                flood-color="#14ff78"
                flood-opacity="0.65" />
            </filter>
          </defs>

          <!-- Silueta de calavera -->
          <path
            class="skull-shape"
            d="M50 6
               C 24 6, 10 24, 10 46
               C 10 62, 16 72, 22 78
               L 22 92
               C 22 98, 26 102, 32 102
               L 38 102
               L 38 110
               C 38 115, 42 118, 46 118
               L 54 118
               C 58 118, 62 115, 62 110
               L 62 102
               L 68 102
               C 74 102, 78 98, 78 92
               L 78 78
               C 84 72, 90 62, 90 46
               C 90 24, 76 6, 50 6 Z" />
          <!-- Cuencas y nariz -->
          <ellipse class="skull-hole" cx="35" cy="48" rx="9" ry="11" />
          <ellipse class="skull-hole" cx="65" cy="48" rx="9" ry="11" />
          <path class="skull-hole" d="M50 62 L 45 74 L 55 74 Z" />
          <!-- Dientes -->
          <rect class="skull-tooth" x="40" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="46" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="52" y="88" width="3" height="10" />
          <rect class="skull-tooth" x="58" y="88" width="3" height="10" />

          <!-- Relleno animado: sube desde abajo con translateY -->
          <g mask="url(#skull-mask)">
            <rect
              id="toxicity-skull-fill"
              x="0"
              y="0"
              width="100"
              height="120"
              class="skull-fill" />
          </g>

          <!-- Máscara: silueta blanca deja ver, agujeros negros ocultan -->
          <defs>
            <mask
              id="skull-mask"
              maskUnits="userSpaceOnUse"
              maskContentUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="100"
              height="120">
              <path
                fill="white"
                d="M50 6
                   C 24 6, 10 24, 10 46
                   C 10 62, 16 72, 22 78
                   L 22 92
                   C 22 98, 26 102, 32 102
                   L 38 102
                   L 38 110
                   C 38 115, 42 118, 46 118
                   L 54 118
                   C 58 118, 62 115, 62 110
                   L 62 102
                   L 68 102
                   C 74 102, 78 98, 78 92
                   L 78 78
                   C 84 72, 90 62, 90 46
                   C 90 24, 76 6, 50 6 Z" />
              <ellipse fill="black" cx="35" cy="48" rx="9" ry="11" />
              <ellipse fill="black" cx="65" cy="48" rx="9" ry="11" />
              <path fill="black" d="M50 62 L 45 74 L 55 74 Z" />
              <rect fill="black" x="40" y="88" width="3" height="10" />
              <rect fill="black" x="46" y="88" width="3" height="10" />
              <rect fill="black" x="52" y="88" width="3" height="10" />
              <rect fill="black" x="58" y="88" width="3" height="10" />
            </mask>
          </defs>
        </svg>
      </div>

      <div
        id="toxicity-status"
        class="sr-only"
        role="status"
        aria-live="polite"
        aria-atomic="true"></div>

      <div id="controls-hint">
        WASD mover · U/J profundidad · I impulso · Q/E giro · Espacio backflip ·
        B filtro · C mirar atrás · R reiniciar · Enter pausa
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
